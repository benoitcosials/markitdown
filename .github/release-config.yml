# =============================================================================
# Configuration de Release - Nettoyage automatique pour PR vers main
# =============================================================================
# Ce fichier définit ce qui doit être supprimé/conservé lors de la préparation
# d'une branche release propre à partir de develop.

# Dossiers cachés à nettoyer (supprimés de release, restaurés depuis main si existent)
reset_from_main:
  - .github
  - .vscode
  - .copilot-tracking
  - .devcontainer

# Fichiers/dossiers racine à toujours supprimer (même s'ils n'existent pas dans main)
always_remove:
  - .cursorrules

# Fichiers packages/ ajoutés (non présents dans main) à conserver
# Ces fichiers représentent les nouvelles fonctionnalités développées
keep_packages:
  # MCP Server - nouveaux modules
  - packages/markitdown-mcp/src/markitdown_mcp/server.py
  - packages/markitdown-mcp/src/markitdown_mcp/tools.py
  - packages/markitdown-mcp/src/markitdown_mcp/utils.py
  - packages/markitdown-mcp/tests/test_vision_enhancement_helpers.py
  
  # Markitdown - nouveaux tests
  - packages/markitdown/tests/test_pptx_image_helpers.py

# Note: Les fichiers modifiés (M) dans packages/ sont automatiquement conservés
# car ils existent déjà dans main et seront mergés normalement.
